# Builds an unsigned Madeira IPA on GitHub's macOS runners.
#
# Save this as .github/workflows/build.yml in your fork.
#
# What it does:
#   1. llvm-ios job: builds the LLVM-for-iOS toolchain DXMT needs. This takes
#      hours, so it only runs when the cache is empty (first run, or when you
#      bump LLVM_COMMIT / LLVM_CACHE_VERSION).
#   2. build job: builds FFmpeg, the Wine unix libs, FEX, DXMT and the pairing
#      library, then runs xcodebuild and packages an unsigned .ipa.
#
# The DLL farm, GnuTLS and the D3D12 runtime are tracked in the repo, so the
# ARM64EC Windows modules are NOT rebuilt unless you tick "rebuild_pe".
#
# The IPA is unsigned on purpose: SideStore / AltStore / Sideloadly re-sign it
# with your own Apple ID when you install it.

name: Build Madeira IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode configuration (Debug is the one that runs games)"
        type: choice
        options: [Debug, Release]
        default: Debug
      rebuild_pe:
        description: "Rebuild ARM64EC modules (FEX xtajit64, Wine ntdll, DXMT) instead of using the committed ones"
        type: boolean
        default: false
      include_vcruntime:
        description: "Download Microsoft's VC++ runtime and bundle it (keep that IPA private, never publish it)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSES/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Upstream llvm-project commit from docs/BUILDING.md
  LLVM_COMMIT: 8dfdcc7b7
  # Bump to throw away the cached LLVM build and rebuild it
  LLVM_CACHE_VERSION: v1
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # LLVM for iOS (slow, cached)
  # ---------------------------------------------------------------------------
  llvm-ios:
    name: LLVM for iOS (cached)
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - name: Restore finished LLVM build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}

      # A failed job can't save a normal cache, so every attempt also saves
      # its progress under a "partial" key and the next attempt resumes from
      # it instead of recompiling everything.
      - name: Restore partial LLVM build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-partial-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llvm-ios-partial-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}-

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          df -h /

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Fetch LLVM source (only the folders the build needs)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f toolchains/llvm-project/llvm/CMakeLists.txt ]; then
            echo "LLVM source already present (restored from the partial cache)"
            exit 0
          fi
          # The doc only gives a short hash; shallow fetches need the full one.
          SHA=$(gh api "repos/llvm/llvm-project/commits/${LLVM_COMMIT}" --jq .sha)
          echo "Using llvm-project $SHA"
          mkdir -p toolchains/llvm-project
          cd toolchains/llvm-project
          git init -q
          git remote add origin https://github.com/llvm/llvm-project.git
          git sparse-checkout set --cone llvm cmake third-party
          git fetch -q --depth 1 --filter=blob:none origin "$SHA"
          git checkout -q FETCH_HEAD
          rm -rf .git

      - name: Build host tablegen tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_ENABLE_ZLIB=Off \
            -DLLVM_ENABLE_ZSTD=Off \
            -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_ENABLE_TERMINFO=Off
          ninja -C toolchains/llvm-host-build llvm-tblgen

          # Newer LLVM also has llvm-min-tblgen; the pinned commit does not
          # (ninja: "unknown target"), so only build it if it exists.
          TARGETS=$(ninja -C toolchains/llvm-host-build -t targets all)
          if grep -q '^llvm-min-tblgen:' <<<"$TARGETS"; then
            ninja -C toolchains/llvm-host-build llvm-min-tblgen
          fi
          ls toolchains/llvm-host-build/bin

      - name: Build LLVM libraries for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Flags are the ones recorded in docs/BUILDING.md (read back from the
          # author's CMakeCache), plus switches that stop CMake picking up
          # macOS host libraries.
          #
          # CMAKE_MACOSX_BUNDLE=OFF: CMake builds executables as app bundles
          # when targeting iOS, and LLVM's tablegen install() rule then fails
          # with "no BUNDLE DESTINATION". LLVM_TABLEGEN points the build at the
          # host llvm-tblgen from the previous step so it doesn't try to build
          # its own native copy.
          #
          # LLVM_NO_DEAD_STRIP=ON: LLVM only treats "Darwin" as macOS, so for
          # iOS it passes the Linux flag --gc-sections to Apple's linker, which
          # fails with "ld: unknown options: --gc-sections".
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host \
            -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_BUILD_TOOLS=Off \
            -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_INCLUDE_EXAMPLES=Off \
            -DLLVM_INCLUDE_BENCHMARKS=Off \
            -DLLVM_ENABLE_ZLIB=Off \
            -DLLVM_ENABLE_ZSTD=Off \
            -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_ENABLE_TERMINFO=Off \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLVM_NO_DEAD_STRIP=ON \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$PWD/toolchains/llvm-host-build/bin"

          # Keep going past failures (-k 0). LLVM's shared-library targets
          # (LLVMHello, LTO, Remarks) can't link for iOS: for anything that
          # isn't "Darwin" it writes a Windows-style .def export file, which
          # Apple's linker rejects ("unknown file type ... .def"). We don't need
          # them, only the static libraries, so afterwards insist that every
          # libLLVM*.a target is built.
          cmake --build toolchains/llvm-ios-build -- -k 0 \
            || echo "Some non-library targets failed (expected); checking the static libraries..."
          LIBS=$(ninja -C toolchains/llvm-ios-build -t targets all | sed -n 's/^\(lib\/libLLVM[A-Za-z0-9_]*\.a\):.*/\1/p')
          echo "$(echo "$LIBS" | wc -l) static libraries expected"
          ninja -C toolchains/llvm-ios-build $LIBS

      # Runs even if the build above failed, so the next attempt can resume.
      - name: Save partial LLVM build
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-partial-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Trim cache size
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Object files are the bulk of a CMake build tree; the static
          # libraries and headers are what the DXMT build uses.
          find toolchains/llvm-ios-build toolchains/llvm-host-build -name '*.o' -delete
          du -sh toolchains/*

      - name: Save finished LLVM build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}

  # ---------------------------------------------------------------------------
  # Madeira itself
  # ---------------------------------------------------------------------------
  build:
    name: Build IPA
    needs: llvm-ios
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      contents: write # only used to attach the IPA to a release on tag pushes
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
      - name: Check out repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h /

      - name: Metal toolchain (Xcode 26 ships it as a separate download)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install build tools
        run: |
          brew install cmake ninja meson bison pkgconf nasm ldid
          # gnutls + freetype: only so Wine's configure records
          # SONAME_LIBGNUTLS / SONAME_LIBFREETYPE in config.h (bcrypt's unix
          # side does dlopen(SONAME_LIBGNUTLS) and won't compile without it).
          # The libraries that actually get linked are the iOS builds below.
          brew install gnutls freetype
          # macOS ships bison 2.3; Wine's tools need 3+
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios

      - name: Restore LLVM for iOS
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_COMMIT }}-${{ env.LLVM_CACHE_VERSION }}
          fail-on-cache-miss: true

      # The project requires this folder, but it is git-ignored. Empty is fine:
      # the official releases do not ship Microsoft's runtime either.
      - name: Prepare VC++ runtime folder
        env:
          INCLUDE_VCRUNTIME: ${{ inputs.include_vcruntime }}
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          if [ "$INCLUDE_VCRUNTIME" = "true" ]; then
            brew install sevenzip
            curl -fsSL -o /tmp/VC_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
            7zz x /tmp/VC_redist.x64.exe -o/tmp/vcredist -y
            7zz x /tmp/vcredist/.rsrc/1033/CABINET/*.cab -oapp/Madeira/x86_64-vcruntime -y
            ls app/Madeira/x86_64-vcruntime
            test "$(ls app/Madeira/x86_64-vcruntime/*.dll | wc -l)" -ge 12
          fi

      - name: FFmpeg (LGPL-only)
        run: bash build/ffmpeg/build.sh

      # --- inputs the Wine unix-side scripts need but the repo does not ship ---
      # (found by reading build/ntdll-unix/build.sh: it includes
      # toolchains/gnutls-ios/include and research/freetype/include, and
      # compiles against a configured wine/build-macos tree)
      - name: GnuTLS for iOS (GMP, Nettle, GnuTLS)
        run: bash build/gnutls-ios/build.sh

      - name: FreeType for iOS
        run: |
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh

      # Wine's configure on an Apple Silicon Mac builds for aarch64 and refuses
      # to continue without a Windows (PE) cross-compiler: "PE cross-compilation
      # is required for aarch64". llvm-mingw is that compiler. It is also what
      # the optional ARM64EC rebuild further down uses, and its folder name is
      # the one the repo's build scripts expect under toolchains/.
      - name: llvm-mingw toolchain
        run: |
          VER=20260421
          NAME="llvm-mingw-${VER}-ucrt-macos-universal"
          curl -fsSL -o "/tmp/${NAME}.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${VER}/${NAME}.tar.xz"
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  /tmp/${NAME}.tar.xz" | shasum -a 256 -c -
          mkdir -p toolchains
          tar -xJf "/tmp/${NAME}.tar.xz" -C toolchains
          echo "$PWD/toolchains/${NAME}/bin" >> "$GITHUB_PATH"
          ls "toolchains/${NAME}/bin" | grep -E '^aarch64-w64-mingw32-(clang|gcc)$' || true

      # The scripts compile Wine's unix sources with -include
      # wine/build-macos/include/config.h and need Wine's widl-generated headers
      # from the same tree. Wine's own headers pull in many of them (for example
      # combaseapi.h needs objidlbase.h, which only exists once widl has run),
      # so generate all of them with "make include/all" instead of a short list.
      - name: Wine host tree (config.h and generated headers)
        run: |
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --disable-tests
          make -j"$(sysctl -n hw.ncpu)" include/all
          ls -l include/config.h include/mfobjects.h include/mftransform.h include/dwrite.h include/dwrite_3.h include/objidlbase.h
          echo "generated headers: $(ls include/*.h | wc -l)"
          grep -q '^#define SONAME_LIBGNUTLS' include/config.h || {
            echo "::error::Wine's configure did not find GnuTLS, so SONAME_LIBGNUTLS is missing from config.h"
            exit 1
          }

      # server_ios.c prints a diagnostic that reads rusage_info_v6's
      # ri_page_wait_time_mach, a field the Xcode 26.6 iPhone SDK doesn't have.
      # Only that one number in a debug log line is affected, so when the SDK
      # lacks the field it is replaced by 0.0 in the runner's checkout (never
      # committed). With an SDK that has the field nothing is touched.
      - name: Work around an SDK difference in server_ios.c
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          if grep -rq 'ri_page_wait_time_mach' "$SDK/usr/include"; then
            echo "SDK has ri_page_wait_time_mach; nothing to patch"
          else
            echo "SDK lacks ri_page_wait_time_mach; patching the diagnostic line"
            sed -i '' 's/XP_MS( ru\.ri_page_wait_time_mach - pru\.ri_page_wait_time_mach )/0.0/' build/ntdll-unix/server_ios.c
            if grep -q 'ri_page_wait_time_mach' build/ntdll-unix/server_ios.c; then
              echo "::error::ri_page_wait_time_mach is still referenced in server_ios.c after patching"
              grep -n 'ri_page_wait_time_mach' build/ntdll-unix/server_ios.c
              exit 1
            fi
          fi

      # build/ntdll-unix/build.sh counts compile failures but hides the
      # compiler's output in obj/*.err, so print the errors of the files that
      # failed (the ones with no .o) when the script fails.
      - name: Wine unix libraries (ntdll)
        run: |
          if ! bash build/ntdll-unix/build.sh; then
            for f in build/ntdll-unix/obj/*.err; do
              [ -s "$f" ] || continue
              n="$(basename "$f" .err)"
              [ -f "build/ntdll-unix/obj/$n.o" ] && continue
              echo "---------- failed to compile: $n ----------"
              grep -E -B2 -A8 'error' "$f" | head -60
            done
            exit 1
          fi

      # build/wineserver/build.sh does not compile Wine's server from scratch:
      # it copies a PREBUILT libwineserver.a (app/Madeira/libwineserver.a, which
      # is git-ignored and not in the repo) and swaps its patched objects in.
      # Without a base archive it stops with "No base libwineserver.a found".
      # So this step builds the unpatched server objects first, with the
      # script's own compiler flags (read out of the script so they can't drift),
      # and seeds the archive with them. UNVERIFIED: the author's real base
      # archive may have been built differently.
      - name: Wine server (seed base archive, then apply the patched objects)
        run: |
          set -euo pipefail
          R="$PWD"
          WINE_SRC="$R/wine"
          BUILD_DIR="$R/build/wineserver"
          SHIMS_DIR="$R/build/ntdll-unix/shims"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          OBJ="$BUILD_DIR/obj"
          mkdir -p "$OBJ/base"
          eval "$(sed -n '/^CC_FLAGS=(/,/^)/p' build/wineserver/build.sh)"
          echo "using ${#CC_FLAGS[@]} compiler flags from build/wineserver/build.sh"
          # Sources build.sh replaces with its own patched versions, plus the
          # Linux-only ones (ptrace/procfs).
          SKIP=" async class event fd handle inproc_sync mach main mapping object process queue region request semaphore sock thread unicode user window winstation procfs ptrace "
          for f in wine/server/*.c; do
            n="$(basename "$f" .c)"
            case "$SKIP" in *" $n "*) continue ;; esac
            echo -n "  $n... "
            if xcrun -sdk iphoneos clang "${CC_FLAGS[@]}" -c "$f" -o "$OBJ/base/$n.o" 2>"$OBJ/base/$n.err"; then
              echo OK
            else
              echo FAILED
              head -30 "$OBJ/base/$n.err"
              exit 1
            fi
          done
          ar rcs "$OBJ/libwineserver.a" "$OBJ"/base/*.o
          bash build/wineserver/build.sh

      - name: Wine unix libraries (win32u)
        run: bash build/win32u-unix/build.sh

      # build/fex-ios/build.sh configures with -DCMAKE_SYSTEM_NAME=iOS and
      # nothing else about the CPU. On the runner CMake then leaves
      # CMAKE_SYSTEM_PROCESSOR empty (FEX's CMakeLists.txt:89 and :115 fail on
      # that), and FEX's default TUNE_CPU=native reads /proc/cpuinfo, which macOS
      # doesn't have. The repo's other FEX scripts name TUNE_CPU for the same
      # reason, so add both options (and the policy floor the WOW64 script uses
      # for CMake 4) to the first-run configure, in the runner's checkout only.
      - name: FEX for iOS
        run: |
          S=build/fex-ios/build.sh
          add() {  # add <option-name> <full -D option>: insert it unless the script already sets it
            if grep -q -- "$1" "$S"; then
              echo "$S already sets $1"
            else
              sed -i '' "s/-DCMAKE_SYSTEM_NAME=iOS/-DCMAKE_SYSTEM_NAME=iOS $2/" "$S"
              grep -q -- "$1" "$S" || { echo "::error::could not add $1 to $S"; exit 1; }
            fi
          }
          add CMAKE_SYSTEM_PROCESSOR -DCMAKE_SYSTEM_PROCESSOR=arm64
          add TUNE_CPU -DTUNE_CPU=none
          add CMAKE_POLICY_VERSION_MINIMUM -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          grep -n -A4 'cmake -S' "$S"
          bash "$S"

      # airconv_context.cpp includes air_msad.h, air_samplepos.h and
      # air_tessellation.h: the three helper shaders in dxmt/src/airconv/shaders
      # compiled to AIR and dumped as C arrays. DXMT's meson build makes them
      # (src/airconv/meson.build, metalir_generator + hexdump_generator) but
      # build/dxmt-ios/build.sh only makes dxmt_command.h, so without these the
      # airconv_context unit fails with "file not found". Same commands as meson.
      - name: DXMT airconv shader headers
        run: |
          H="$PWD/build/dxmt-ios/shader-headers"
          mkdir -p "$H"
          cd "$H"
          for n in air_msad air_samplepos air_tessellation; do
            xcrun -sdk macosx metal -std="${DXMT_METAL_STD:-metal3.1}" --target=air64-apple-macos14.0 \
              -o "$n.air" -c "$GITHUB_WORKSPACE/dxmt/src/airconv/shaders/$n.metal"
            xxd -n "$n" -i "$n.air" "$n.h"
            ls -l "$n.h"
            grep -q "unsigned char $n\[\]" "$n.h" || { echo "::error::$n.h has no $n array"; exit 1; }
          done

      - name: DXMT for iOS
        run: bash build/dxmt-ios/build.sh

      - name: In-app pairing library (Rust)
        run: bash build/rppairing-ios/build.sh

      # The unix-side scripts (Wine, DXMT) count compile failures but hide the
      # compiler's output in .err files (which also hold plain warnings for files
      # that compiled fine); print the errors of the files that did NOT produce a .o.
      - name: Show compiler errors from the build scripts
        if: failure()
        run: |
          for d in build/ntdll-unix/obj build/wineserver/obj build/win32u-unix/obj build/dxmt-ios/obj; do
            [ -d "$d" ] || continue
            for f in "$d"/*.err "$d"/err-*.txt; do
              [ -s "$f" ] || continue
              b="$(basename "$f")"; n="${b%.err}"; n="${n#err-}"; n="${n%.txt}"
              [ -f "$d/$n.o" ] && continue
              echo "---------- failed to compile: $d/$n ----------"
              grep -E -B2 -A8 'error' "$f" | head -60
            done
          done

      # ---- optional: rebuild the ARM64EC Windows side --------------------------
      # (uses the llvm-mingw toolchain installed earlier)
      - name: Rebuild ARM64EC modules (FEX, Wine ntdll, DXMT)
        if: ${{ inputs.rebuild_pe }}
        run: |
          bash build/fex-arm64ec/build.sh
          bash build/wine-pe/build-ntdll.sh
          meson setup dxmt/build-arm64ec dxmt \
            -Dbuildtype=release \
            -Dwine_build_path=../../wine/build-arm64ec \
            --cross-file=dxmt/build-arm64ec-win.txt
          ninja -C dxmt/build-arm64ec
          find dxmt/build-arm64ec \( -name winemetal.dll -o -name d3d11.dll \) \
            -exec cp -v {} app/Madeira/arm64ec-windows/ \;
      # --------------------------------------------------------------------------

      # The Xcode build fails if the bundled licence copies are stale.
      - name: Refresh bundled licences
        run: bash build/stage-licenses.sh

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name 'Madeira.app' -type d | head -n 1)
          test -n "$APP" || { echo "Madeira.app not found"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")

          # An unsigned build carries no entitlements, and the sideloading tools
          # copy them from the binary, so pseudo-sign them in with ldid.
          ENT=$(find app -name '*.entitlements' | head -n 1)
          if [ -n "$ENT" ]; then
            echo "Embedding entitlements from $ENT"
            ldid -S"$ENT" "$APP/$EXE"
          else
            echo "No .entitlements file found; the IPA has none."
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Madeira-unsigned.ipa Payload
          ls -lh Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: Madeira-unsigned.ipa
          compression-level: 0
          retention-days: 7

      # Pushing a tag like v1.0.0 also attaches the IPA to a GitHub release
      # (tag builds never include Microsoft's runtime).
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Madeira-unsigned.ipa
